  <path d="M55 70 q11 -34 22 0" fill="none" stroke="#1D1D1B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="66" cy="46" r="7" fill="#1D1D1B"/>
  <text x="66" y="102" text-anchor="middle" class="txt" font-size="15" font-weight="600">ONE</text>

  <!-- nav active: Home -->
  <rect x="20" y="150" width="92" height="84" rx="18" fill="#FF9900" opacity="0.16"/>
  <g transform="translate(50,166)" fill="none" stroke="#FF9900" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
