<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="pipe" cx="48%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#0c0b0a"/>
      <stop offset="42%" stop-color="#2a241d"/>
      <stop offset="72%" stop-color="#4a4035"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </radialGradient>
  </defs>

  <!-- ===== LIVE VIDEO (full-bleed, Cinema/Vollbild) ===== -->
  <rect width="1280" height="800" fill="#000"/>
  <rect width="1280" height="800" fill="url(#pipe)"/>
  <!-- pipe rings -->
  <g fill="none" stroke="#5a4f41" stroke-opacity="0.5" stroke-width="2">
    <ellipse cx="612" cy="368" rx="520" ry="360"/>
    <ellipse cx="612" cy="368" rx="400" ry="278"/>
    <ellipse cx="612" cy="368" rx="290" ry="202"/>
    <ellipse cx="612" cy="368" rx="190" ry="132"/>
    <ellipse cx="612" cy="368" rx="104" ry="72"/>
  </g>
  <!-- water line + small crack hint -->
  <path d="M150 560 Q612 660 1080 560" fill="none" stroke="#3a4a55" stroke-opacity="0.55" stroke-width="6"/>
  <path d="M520 300 l34 -40 l10 36 l38 -8" fill="none" stroke="#0a0a0a" stroke-opacity="0.7" stroke-width="3"/>

  <!-- ===== TOP OVERLAYS ===== -->
  <!-- back button -->
  <circle cx="58" cy="58" r="30" fill="#000" fill-opacity="0.55"/>
  <path d="M66 44 l-14 14 l14 14" fill="none" stroke="#F2F2F7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- OSD burn-in (project + station + date) -->
  <rect x="104" y="34" width="612" height="92" rx="10" fill="#000" fill-opacity="0.62"/>
  <text x="124" y="68" fill="#F2F2F7" font-size="22" font-weight="600">Musterstraße 12 · Haltung 1003</text>
  <text x="124" y="102" fill="#98989D" font-size="18">Station <tspan fill="#FF9900" font-weight="600">12,40 m</tspan>   ·   2026-06-04  14:32:08</text>

  <!-- REC indicator -->
  <rect x="828" y="40" width="150" height="44" rx="22" fill="#000" fill-opacity="0.55"/>
  <circle cx="854" cy="62" r="9" fill="#FF453A"/>
  <text x="872" y="69" fill="#F2F2F7" font-size="19" font-weight="600">REC 00:42</text>

  <!-- hardware status chips (top-right) -->
  <g>
    <rect x="996" y="40" width="116" height="44" rx="22" fill="#000" fill-opacity="0.55"/>
    <g transform="translate(1012,52)" fill="none" stroke="#FF9900" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="9" r="7"/><line x1="6" y1="19" x2="14" y2="19"/></g>
    <text x="1036" y="69" fill="#F2F2F7" font-size="18" font-weight="600">60%</text>

    <rect x="1124" y="40" width="132" height="44" rx="22" fill="#000" fill-opacity="0.55"/>
    <g transform="translate(1138,51)" fill="none" stroke="#0A84FF" stroke-width="2.2"><circle cx="11" cy="11" r="9"/><circle cx="11" cy="11" r="4"/></g>
    <text x="1162" y="69" fill="#F2F2F7" font-size="17" font-weight="600">33 kHz</text>
  </g>

  <!-- ===== BOTTOM SOFTBUTTON BAR (große Touch-Ziele) ===== -->
  <rect x="0" y="648" width="1280" height="152" fill="#000" fill-opacity="0.72"/>
  <line x1="0" y1="648" x2="1280" y2="648" stroke="#FF9900" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Foto -->
  <rect x="56" y="668" width="132" height="112" rx="16" fill="#2C2C2E"/>
  <g transform="translate(98,690)" fill="none" stroke="#F2F2F7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="12" width="48" height="38" rx="8"/><path d="M14 12 L19 4 H29 L34 12"/><circle cx="24" cy="31" r="11"/></g>
  <text x="122" y="766" text-anchor="middle" fill="#F2F2F7" font-size="18" font-weight="600">Foto</text>

  <!-- Schaden -->
  <rect x="204" y="668" width="132" height="112" rx="16" fill="#2C2C2E"/>
  <g transform="translate(246,690)" fill="none" stroke="#FFD60A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4 L48 46 H0 Z"/><line x1="24" y1="20" x2="24" y2="33"/></g>
  <circle cx="270" cy="731" r="2.8" fill="#FFD60A"/>
  <text x="270" y="766" text-anchor="middle" fill="#F2F2F7" font-size="18" font-weight="600">Schaden</text>

  <!-- Aufnahme (center, primary) -->
  <circle cx="640" cy="712" r="56" fill="#FF9900"/>
  <circle cx="640" cy="712" r="56" fill="none" stroke="#1D1D1B" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="624" y="696" width="32" height="32" rx="8" fill="#1D1D1B"/>
  <text x="640" y="792" text-anchor="middle" fill="#FF9900" font-size="18" font-weight="600">Aufnahme</text>

  <!-- Sonde -->
  <rect x="792" y="668" width="132" height="112" rx="16" fill="#2C2C2E"/>
  <g transform="translate(834,690)" fill="none" stroke="#0A84FF" stroke-width="3"><circle cx="24" cy="27" r="20"/><circle cx="24" cy="27" r="10"/><circle cx="24" cy="27" r="2.5" fill="#0A84FF"/></g>
  <text x="858" y="766" text-anchor="middle" fill="#F2F2F7" font-size="18" font-weight="600">Sonde</text>

  <!-- Licht (− / +) -->
  <rect x="940" y="668" width="196" height="112" rx="16" fill="#2C2C2E"/>
  <circle cx="976" cy="712" r="30" fill="#3A3A3C"/>
  <line x1="962" y1="712" x2="990" y2="712" stroke="#F2F2F7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1100" cy="712" r="30" fill="#3A3A3C"/>
  <line x1="1086" y1="712" x2="1114" y2="712" stroke="#F2F2F7" stroke-width="4" stroke-linecap="round"/>
  <line x1="1100" y1="698" x2="1100" y2="726" stroke="#F2F2F7" stroke-width="4" stroke-linecap="round"/>
  <text x="1038" y="706" text-anchor="middle" fill="#F2F2F7" font-size="22" font-weight="600">60%</text>
  <text x="1038" y="730" text-anchor="middle" fill="#98989D" font-size="14">Licht</text>

  <!-- Meter 0 -->
  <rect x="1152" y="668" width="104" height="112" rx="16" fill="#2C2C2E"/>
  <g transform="translate(1176,692)" fill="none" stroke="#F2F2F7" stroke-width="2.8" stroke-linejoin="round"><rect x="0" y="10" width="56" height="22" rx="4"/><line x1="12" y1="10" x2="12" y2="20"/><line x1="24" y1="10" x2="24" y2="24"/><line x1="36" y1="10" x2="36" y2="20"/><line x1="48" y1="10" x2="48" y2="24"/></g>
  <text x="1204" y="766" text-anchor="middle" fill="#F2F2F7" font-size="18" font-weight="600">Meter 0</text>
</svg>
